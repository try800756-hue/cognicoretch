<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>CogniCoreTech | Independent Search & Developer Gateway</title>
    <style>
        :root {
            --bg-color: #0f172a;
            --card-bg: #1e293b;
            --text-color: #f8fafc;
            --accent-color: #38bdf8;
            --accent-hover: #0ea5e9;
            --border-color: #334155;
        }
        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
            font-family: system-ui, -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, Oxygen, Ubuntu, Cantarell, sans-serif;
        }
        body {
            background-color: var(--bg-color);
            color: var(--text-color);
            display: flex;
            flex-direction: column;
            min-height: 100vh;
            justify-content: space-between;
            align-items: center;
            padding: 2rem;
        }
        .container {
            width: 100%;
            max-width: 700px;
            display: flex;
            flex-direction: column;
            align-items: center;
            margin-top: 15vh;
        }
        h1 {
            font-size: 2.5rem;
            font-weight: 800;
            letter-spacing: -0.05em;
            margin-bottom: 0.5rem;
            color: var(--text-color);
        }
        h1 span {
            color: var(--accent-color);
        }
        p.tagline {
            color: #94a3b8;
            margin-bottom: 2rem;
            font-size: 1rem;
        }
        .search-box {
            width: 100%;
            display: flex;
            background: var(--card-bg);
            border: 1px solid var(--border-color);
            border-radius: 9999px;
            padding: 0.5rem 1rem;
            box-shadow: 0 4px 6px -1px rgba(0, 0, 0, 0.1), 0 2px 4px -1px rgba(0, 0, 0, 0.06);
            transition: border-color 0.2s;
        }
        .search-box:focus-within {
            border-color: var(--accent-color);
        }
        .search-input {
            flex: 1;
            background: transparent;
            border: none;
            color: var(--text-color);
            font-size: 1rem;
            padding: 0.5rem;
            outline: none;
        }
        .search-btn {
            background-color: var(--accent-color);
            color: var(--bg-color);
            border: none;
            border-radius: 9999px;
            padding: 0.5rem 1.5rem;
            font-weight: 600;
            cursor: pointer;
            transition: background-color 0.2s;
        }
        .search-btn:hover {
            background-color: var(--accent-hover);
        }
        #results-container {
            width: 100%;
            margin-top: 2rem;
            display: flex;
            flex-direction: column;
            gap: 1rem;
        }
        .result-card {
            background: var(--card-bg);
            border: 1px solid var(--border-color);
            padding: 1.25rem;
            border-radius: 0.75rem;
            text-align: left;
        }
        .result-card a {
            color: var(--accent-color);
            font-size: 1.1rem;
            text-decoration: none;
            font-weight: 600;
        }
        .result-card a:hover {
            text-decoration: underline;
        }
        .result-card p {
            color: #94a3b8;
            font-size: 0.9rem;
            margin-top: 0.4rem;
        }
        footer {
            color: #64748b;
            font-size: 0.85rem;
            text-align: center;
            padding: 1rem;
        }
    </style>
</head>
<body>
    <div class="container">
        <h1>Cogni<span>CoreTech</span></h1>
        <p class="tagline">Independent, privacy-first search and developer infrastructure.</p>
        
        <div class="search-box">
            <input type="text" id="query-input" class="search-input" placeholder="Search the web or execute developer tools..." autofocus>
            <button class="search-btn" onclick="executeSearch()">Search</button>
        </div>

        <div id="results-container"></div>
    </div>

    <footer>
        &copy; 2026 CogniCoreTech Enterprise. All rights reserved.
    </footer>

    <script>
        async function executeSearch() {
            const query = document.getElementById('query-input').value.trim();
            const container = document.getElementById('results-container');
            
            if (!query) return;

            container.innerHTML = '<p style="color: #94a3b8; text-align: center;">Searching nodes...</p>';

            try {
                // Points to local FastAPI backend during development; replace with domain in production
                const response = await fetch(`http://localhost:8000/api/v1/search?q=${encodeURIComponent(query)}`);
                const data = await response.json();

                container.innerHTML = '';
                
                if (data.results && data.results.length > 0) {
                    data.results.forEach(res => {
                        const card = document.createElement('div');
                        card.className = 'result-card';
                        card.innerHTML = `
                            <a href="${res.url}" target="_blank">${res.title}</a>
                            <p>${res.snippet}</p>
                        `;
                        container.appendChild(card);
                    });
                } else {
                    container.innerHTML = '<p style="color: #94a3b8; text-align: center;">No telemetry results located.</p>';
                }
            } catch (error) {
                container.innerHTML = '<p style="color: #f87171; text-align: center;">Error connecting to CogniCoreTech gateway daemon.</p>';
            }
        }

        // Trigger search on pressing Enter
        document.getElementById('query-input').addEventListener('keypress', function (e) {
            if (e.key === 'Enter') {
                executeSearch();
            }
        });
    </script>
</body>
</html>
