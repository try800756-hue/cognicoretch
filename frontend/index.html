<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>CogniCoreTech | Enterprise Intelligence Gateway</title>
    <script src="https://cdn.jsdelivr.net/npm/@tailwindcss/browser@4"></script>
</head>
<body class="bg-[#090a0f] text-zinc-100 min-h-screen flex flex-col justify-between selection:bg-cyan-500 selection:text-black font-mono">
    
    <!-- Top Nav -->
    <header class="border-b border-zinc-800/80 px-6 py-4 flex justify-between items-center bg-zinc-950/80 backdrop-blur-xl sticky top-0 z-50">
        <div class="flex items-center space-x-3">
            <div class="w-3 h-3 bg-cyan-400 rounded-full shadow-[0_0_12px_rgba(34,211,238,0.7)] animate-pulse"></div>
            <span class="font-extrabold tracking-wider text-lg">COGNI<span class="text-cyan-400">CORE</span>.TECH</span>
        </div>
        <div class="flex items-center space-x-4">
            <span class="text-[10px] text-zinc-400 hidden sm:inline border border-zinc-800 px-2.5 py-1 rounded-md bg-zinc-900/50">SECURE ZERO-TRUST NODE</span>
            <div class="text-xs text-zinc-400 border border-zinc-800 px-3 py-1 rounded-full bg-zinc-900">
                STATUS: <span class="text-emerald-400 font-bold">ONLINE</span>
            </div>
        </div>
    </header>

    <!-- Main Container -->
    <main class="flex-grow flex flex-col items-center px-4 py-16">
        <div class="w-full max-w-4xl text-center space-y-8">
            <div class="space-y-3">
                <h1 class="text-4xl md:text-6xl font-black tracking-tight bg-gradient-to-r from-zinc-100 via-cyan-200 to-cyan-500 bg-clip-text text-transparent">
                    Enterprise Intelligence Engine
                </h1>
                <p class="text-zinc-400 text-sm md:text-base max-w-xl mx-auto">
                    Decentralized developer gateway aggregating web, news, codebases, and media assets instantly.
                </p>
            </div>

            <!-- Search Form -->
            <form id="searchForm" class="flex flex-col gap-4 max-w-2xl mx-auto w-full">
                <div class="flex flex-col sm:flex-row gap-3 shadow-2xl">
                    <input 
                        type="text" 
                        id="queryInput" 
                        placeholder="Search operating systems, tools, repositories..." 
                        required
                        class="flex-grow bg-zinc-900/90 border border-zinc-700/80 rounded-xl px-5 py-4 text-zinc-100 focus:outline-none focus:border-cyan-400 focus:ring-1 focus:ring-cyan-400 text-sm transition-all shadow-inner"
                    >
                    <button 
                        type="submit" 
                        class="bg-cyan-500 hover:bg-cyan-400 text-black font-extrabold px-8 py-4 rounded-xl transition-all text-sm tracking-wider cursor-pointer shadow-[0_0_20px_rgba(6,182,212,0.3)] hover:shadow-[0_0_25px_rgba(6,182,212,0.5)]"
                    >
                        EXECUTE
                    </button>
                </div>

                <!-- Category Filters -->
                <div class="flex justify-center gap-2 text-xs overflow-x-auto py-1">
                    <button type="button" class="filter-btn px-4 py-2 rounded-lg bg-cyan-500 text-black font-bold transition-all cursor-pointer shadow" data-category="all">All Feeds</button>
                    <button type="button" class="filter-btn px-4 py-2 rounded-lg bg-zinc-900 border border-zinc-800 text-zinc-400 hover:text-white transition-all cursor-pointer" data-category="web">Web Results</button>
                    <button type="button" class="filter-btn px-4 py-2 rounded-lg bg-zinc-900 border border-zinc-800 text-zinc-400 hover:text-white transition-all cursor-pointer" data-category="news">News & Blogs</button>
                    <button type="button" class="filter-btn px-4 py-2 rounded-lg bg-zinc-900 border border-zinc-800 text-zinc-400 hover:text-white transition-all cursor-pointer" data-category="code">FOSS & Code</button>
                    <button type="button" class="filter-btn px-4 py-2 rounded-lg bg-zinc-900 border border-zinc-800 text-zinc-400 hover:text-white transition-all cursor-pointer" data-category="media">Media & Assets</button>
                </div>
            </form>

            <!-- Results Section -->
            <div id="resultsContainer" class="hidden text-left mt-10 space-y-4">
                <div class="flex justify-between items-center border-b border-zinc-800/80 pb-3">
                    <h3 class="text-xs text-zinc-400 uppercase tracking-widest font-bold">Aggregated Execution Feed</h3>
                    <span id="resultCount" class="text-xs text-cyan-400 font-bold">0 records indexed</span>
                </div>
                <div id="resultsList" class="space-y-4 text-sm"></div>
            </div>
        </div>
    </main>

    <!-- Footer -->
    <footer class="border-t border-zinc-800/80 px-6 py-6 text-center text-xs text-zinc-600 bg-zinc-950/50">
        &copy; 2026 CogniCoreTech. Zero-Trust Architecture &bull; Arch Linux FOSS Node
    </footer>

    <!-- JavaScript Gateway Integration -->
    <script>
        const form = document.getElementById('searchForm');
        const queryInput = document.getElementById('queryInput');
        const resultsContainer = document.getElementById('resultsContainer');
        const resultsList = document.getElementById('resultsList');
        const resultCount = document.getElementById('resultCount');
        const filterBtns = document.querySelectorAll('.filter-btn');
        
        let currentCategory = 'all';
        let cachedResults = [];

        filterBtns.forEach(btn => {
            btn.addEventListener('click', () => {
                filterBtns.forEach(b => {
                    b.classList.remove('bg-cyan-500', 'text-black', 'font-bold', 'shadow');
                    b.classList.add('bg-zinc-900', 'border', 'border-zinc-800', 'text-zinc-400');
                });
                btn.classList.remove('bg-zinc-900', 'border', 'border-zinc-800', 'text-zinc-400');
                btn.classList.add('bg-cyan-500', 'text-black', 'font-bold', 'shadow');
                currentCategory = btn.getAttribute('data-category');
                renderResults();
            });
        });

        function renderResults() {
            if (!cachedResults.length) return;
            
            const filtered = currentCategory === 'all' 
                ? cachedResults 
                : cachedResults.filter(item => item.type === currentCategory);

            resultCount.innerText = `${filtered.length} records indexed`;
            
            if (filtered.length === 0) {
                resultsList.innerHTML = `<div class="bg-zinc-900/60 border border-zinc-800/80 p-6 rounded-xl text-center text-zinc-400">No records found for category '${currentCategory}'. Switch to 'All Feeds' to explore.</div>`;
                return;
            }

            resultsList.innerHTML = filtered.map(item => `
                <div class="bg-zinc-900/70 border border-zinc-800/80 p-5 rounded-xl space-y-2 hover:border-cyan-500/50 transition-all shadow-lg group">
                    <div class="flex justify-between items-start">
                        <a href="${item.url}" target="_blank" class="text-cyan-400 group-hover:text-cyan-300 font-bold text-base leading-snug underline-offset-4 hover:underline">${item.title}</a>
                        <span class="text-[10px] uppercase font-bold px-2.5 py-1 rounded-md bg-zinc-800 text-zinc-300 tracking-wider border border-zinc-700/50">${item.type}</span>
                    </div>
                    <p class="text-zinc-300 text-xs md:text-sm leading-relaxed">${item.snippet}</p>
                    <div class="text-[11px] text-zinc-500 truncate pt-1 flex items-center space-x-2">
                        <span class="text-zinc-600">Source:</span> 
                        <a href="${item.url}" target="_blank" class="hover:underline text-zinc-400 truncate">${item.url}</a>
                    </div>
                </div>
            `).join('');
        }

        form.addEventListener('submit', async (e) => {
            e.preventDefault();
            const query = queryInput.value.trim();
            if (!query) return;

            resultsContainer.classList.remove('hidden');
            resultsList.innerHTML = '<div class="text-cyan-400 animate-pulse text-center py-12 font-bold tracking-wider">Aggregating decentralized multi-node intelligence feeds...</div>';

            try {
                const response = await fetch(`/api/v1/search?q=${encodeURIComponent(query)}`);
                const data = await response.json();

                if (response.ok && data.results) {
                    cachedResults = data.results;
                    renderResults();
                } else {
                    resultsList.innerHTML = '<div class="text-red-400 text-center py-6 font-bold">Gateway execution error returned.</div>';
                }
            } catch (err) {
                resultsList.innerHTML = `<div class="text-red-400 text-center py-6 font-bold">Connection failed: ${err.message}</div>`;
            }
        });
    </script>
</body>
</html>
