<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>CogniCoreTech | Secure Developer Gateway</title>
    <script src="https://cdn.jsdelivr.net/npm/@tailwindcss/browser@4"></script>
</head>
<body class="bg-zinc-950 text-zinc-100 min-h-screen flex flex-col justify-between selection:bg-cyan-500 selection:text-black">
    
    <!-- Top Nav -->
    <header class="border-b border-zinc-800 px-6 py-4 flex justify-between items-center bg-zinc-900/50 backdrop-blur-md">
        <div class="flex items-center space-x-3">
            <div class="w-3 h-3 bg-cyan-500 rounded-full animate-pulse"></div>
            <span class="font-mono font-bold tracking-wider text-lg">COGNI<span class="text-cyan-400">CORE</span>.TECH</span>
        </div>
        <div class="text-xs font-mono text-zinc-400 border border-zinc-800 px-3 py-1 rounded-full">
            STATUS: <span class="text-emerald-400">ONLINE</span>
        </div>
    </header>

    <!-- Main Search Container -->
    <main class="flex-grow flex flex-col items-center justify-center px-4 py-12">
        <div class="w-full max-w-2xl text-center space-y-6">
            <h1 class="text-3xl md:text-5xl font-extrabold tracking-tight">
                Privacy-First Enterprise Search
            </h1>
            <p class="text-zinc-400 text-sm md:text-base font-mono">
                Decentralized developer gateway powered by independent infrastructure.
            </p>

            <!-- Search Form -->
            <form id="searchForm" class="flex flex-col sm:flex-row gap-3 mt-6">
                <input 
                    type="text" 
                    id="queryInput" 
                    placeholder="Enter query or target package..." 
                    required
                    class="flex-grow bg-zinc-900 border border-zinc-700 rounded-lg px-4 py-3 text-zinc-100 focus:outline-none focus:border-cyan-500 font-mono text-sm"
                >
                <button 
                    type="submit" 
                    class="bg-cyan-500 hover:bg-cyan-400 text-black font-bold px-6 py-3 rounded-lg transition-all font-mono text-sm tracking-wide cursor-pointer"
                >
                    QUERY GATEWAY
                </button>
            </form>

            <!-- Results Section -->
            <div id="resultsContainer" class="hidden text-left mt-8 space-y-4">
                <h3 class="text-xs font-mono text-zinc-500 uppercase tracking-widest border-b border-zinc-800 pb-2">Execution Output</h3>
                <div id="resultsList" class="space-y-3 font-mono text-sm"></div>
            </div>
        </div>
    </main>

    <!-- Footer -->
    <footer class="border-t border-zinc-800 px-6 py-4 text-center text-xs font-mono text-zinc-600">
        &copy; 2026 CogniCoreTech. Zero-Trust Architecture. All rights reserved.
    </footer>

    <!-- JavaScript Gateway Integration -->
    <script>
        const form = document.getElementById('searchForm');
        const queryInput = document.getElementById('queryInput');
        const resultsContainer = document.getElementById('resultsContainer');
        const resultsList = document.getElementById('resultsList');

        form.addEventListener('submit', async (e) => {
            e.preventDefault();
            const query = queryInput.value.trim();
            if (!query) return;

            resultsContainer.classList.remove('hidden');
            resultsList.innerHTML = '<div class="text-cyan-400 animate-pulse">Querying decentralized nodes...</div>';

            try {
                // Automatically points to your live Render backend URL or fallback relative path
                const response = await fetch(`/api/v1/search?q=${encodeURIComponent(query)}`);
                const data = await response.json();

                if (response.ok && data.results) {
                    resultsList.innerHTML = data.results.map(item => `
                        <div class="bg-zinc-900 border border-zinc-800 p-4 rounded-lg space-y-1">
                            <a href="${item.url}" target="_blank" class="text-cyan-400 hover:underline font-bold">${item.title}</a>
                            <p class="text-zinc-400 text-xs">${item.snippet}</p>
                        </div>
                    `).join('');
                } else {
                    resultsList.innerHTML = '<div class="text-red-400">Gateway execution error returned.</div>';
                }
            } catch (err) {
                resultsList.innerHTML = `<div class="text-red-400">Connection failed: ${err.message}</div>`;
            }
        });
    </script>
</body>
</html>
